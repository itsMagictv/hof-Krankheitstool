name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest

      - name: Bekannte Schwachstellen in Abhängigkeiten prüfen
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t krankmeldung:ci .

      - name: Smoke-Test
        run: |
          docker run -d --name km -p 8000:8000 \
            -e ADMIN_PASSWORD=ci-passwort -e SECRET_KEY=ci-secret krankmeldung:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/health | grep -q '"ok"'
          # Startseite liefert Security-Header
          curl -fsI http://127.0.0.1:8000/ | grep -qi '^content-security-policy:'
          # Container läuft nicht als root
          test "$(docker exec km id -u)" != "0"
          # Ohne ADMIN_PASSWORD darf der Container nicht starten
          ! docker run --rm krankmeldung:ci timeout 10 uvicorn app.main:app

      - name: Logs bei Fehler
        if: failure()
        run: docker logs km || true
