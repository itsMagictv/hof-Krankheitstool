name: CI

on:
  push:
    branches: [main, dev]   # dev: nur testen, main: testen + veröffentlichen
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest

      - name: Bekannte Schwachstellen in Abhängigkeiten prüfen
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write   # nur für den Upload nach ghcr.io
    # Veröffentlicht wird nur von main (Push oder manuell), nie aus Pull Requests
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    # Zwei Läufe auf main sollen sich beim Hochladen von :latest nicht überholen
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.description=Krankmeldungs-Tool (Übergangslösung) – Hof Dinkelberg" \
            -t krankmeldung:ci .

      - name: Smoke-Test
        run: |
          docker run -d --name km -p 8000:8000 \
            -e ADMIN_PASSWORD=ci-passwort -e SECRET_KEY=ci-secret krankmeldung:ci
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/health | grep -q '"ok"'
          # Startseite liefert Security-Header
          curl -fsI http://127.0.0.1:8000/ | grep -qi '^content-security-policy:'
          # Container läuft nicht als root
          test "$(docker exec km id -u)" != "0"
          # Ohne ADMIN_PASSWORD darf der Container nicht starten
          ! docker run --rm krankmeldung:ci timeout 10 uvicorn app.main:app

      - name: Logs bei Fehler
        if: failure()
        run: docker logs km || true

      - name: Bei ghcr.io anmelden
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Getestetes Image veröffentlichen
        if: env.PUBLISH == 'true'
        run: |
          # Registry-Namen müssen klein geschrieben sein
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::7}"
          docker tag krankmeldung:ci "${IMG}:${SHA}"
          docker tag krankmeldung:ci "${IMG}:latest"
          docker push "${IMG}:${SHA}"
          docker push "${IMG}:latest"
          {
            echo "### Image veröffentlicht"
            echo ""
            echo "- \`${IMG}:latest\`"
            echo "- \`${IMG}:${SHA}\`"
            echo ""
            echo "Auf dem Server: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
