services:
  krankmeldung:
    build: .
    image: krankmeldung:latest
    container_name: krankmeldung
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - krankmeldung-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  krankmeldung-data:
