# Betrieb: zieht das fertige Image aus der GitHub Container Registry.
#   Starten:      docker compose up -d
#   Aktualisieren: docker compose pull && docker compose up -d
# Für die Entwicklung (lokal bauen) siehe docker-compose.dev.yml.
services:
  krankmeldung:
    image: ghcr.io/itsmagictv/hof-krankheitstool:latest
    container_name: krankmeldung
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - krankmeldung-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  krankmeldung-data:
